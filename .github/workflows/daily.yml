# Job Radar AI: daily run on GitHub Actions.
#
# Main trigger: cron-job.org calls the workflow_dispatch API every day at
# 18:00 Amsterdam time. GitHub's own schedule (often hours late) is only a
# fallback. Every run uses --skip-if-sent-today, so the first successful run
# of the day sends the digest and later runs stop right away.
#
# The repo is PUBLIC: logs are public and caches are readable from pull
# requests, so the program runs with --ci (counts only) and the database is
# only stored encrypted.

name: Daily job radar

on:
  workflow_dispatch:
    inputs:
      mark_all_sent:
        description: "First cloud run: mark all jobs as sent without sending"
        type: boolean
        default: false
  schedule:
    - cron: "23 20 * * *"
      timezone: "Europe/Amsterdam"
    - cron: "23 21 * * *"
      timezone: "Europe/Amsterdam"

# The workflow only needs to read the code.
permissions:
  contents: read

# Never run two at the same time: a second run waits for the first to finish.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # All dates (last digest, first seen, 3-day warning) in Amsterdam time.
      TZ: Europe/Amsterdam

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # No secrets here: the tests use dummy values (tests/conftest.py).
      - name: Run tests
        run: python -m pytest -q

      - name: Restore the encrypted database
        uses: actions/cache/restore@v6
        with:
          path: data/jobs.db.enc
          # This exact key never exists yet, so restore-keys picks the newest
          # cache whose key starts with "jobradar-db-".
          key: jobradar-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: jobradar-db-

      - name: Decrypt the database
        if: hashFiles('data/jobs.db.enc') != ''
        env:
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: python main.py --decrypt-db

      - name: Run Job Radar
        env:
          JOB_EMAIL_ADDRESS: ${{ secrets.JOB_EMAIL_ADDRESS }}
          JOB_EMAIL_APP_PASSWORD: ${{ secrets.JOB_EMAIL_APP_PASSWORD }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_REASONING_EFFORT: ${{ secrets.AI_REASONING_EFFORT }}
          MY_NAME: ${{ secrets.MY_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROFILE_TEXT: ${{ secrets.PROFILE_TEXT }}
          # Passed as an environment variable instead of pasting it into the
          # script below: the safe way to use workflow inputs in a shell.
          MARK_ALL_SENT: ${{ inputs.mark_all_sent }}
        run: |
          if [ "$MARK_ALL_SENT" = "true" ]; then
            python main.py --days 2 --ci --mark-all-sent
          else
            python main.py --days 2 --ci --skip-if-sent-today
          fi

      # always(): also after a failed run, so progress (sent messages,
      # verdicts) is kept. Only when there is a database to encrypt.
      - name: Encrypt the database
        if: always() && hashFiles('data/jobs.db') != ''
        env:
          DB_ENCRYPTION_KEY: ${{ secrets.DB_ENCRYPTION_KEY }}
        run: python main.py --encrypt-db

      - name: Save the encrypted database
        if: always() && hashFiles('data/jobs.db.enc') != ''
        uses: actions/cache/save@v6
        with:
          path: data/jobs.db.enc
          # Cache keys cannot be overwritten, so every run (and every re-run
          # attempt) saves under a new key; the next run restores the newest.
          key: jobradar-db-${{ github.run_id }}-${{ github.run_attempt }}
